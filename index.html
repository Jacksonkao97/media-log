<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediaLog</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">◆</span>
    <h1>MediaLog</h1>
  </div>

  <div class="conn" id="conn">
    <span class="dot" id="connDot"></span>
    <span class="conn-text" id="connText">未连接数据文件夹</span>
    <button class="btn btn-ghost" id="btnConnect">连接文件夹</button>
  </div>

  <div class="spacer"></div>

  <button class="btn btn-ghost" id="btnExport" title="下载所有区域的合并快照">导出备份</button>
  <button class="btn btn-primary" id="btnNew">＋ 新增</button>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>

<section class="toolbar">
  <input type="search" id="search" class="search" placeholder="搜索名称或备注…" autocomplete="off">
  <div class="chips" id="filters"></div>
  <button class="btn btn-ghost btn-sm" id="btnClear" hidden>清除筛选</button>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
</section>

<main>
  <table class="grid" id="grid">
    <thead>
      <tr>
        <th class="col-name"     data-sort="name">名称</th>
        <th class="col-progress" data-sort="progress">进度</th>
        <th class="col-status"   data-sort="status">状态</th>
        <th class="col-category" data-sort="category">分类</th>
        <th class="col-date"     data-sort="createdAt">创建时间</th>
        <th class="col-date"     data-sort="updatedAt">更新时间</th>
        <th class="col-act"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty" hidden></p>
</main>

<dialog class="modal" id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">新增条目</h2>

    <label class="field">
      <span>名称 <b>*</b></span>
      <input name="name" required autocomplete="off" placeholder="例如：全知读者视角">
    </label>

    <div class="row2">
      <label class="field">
        <span>进度</span>
        <input name="progress" autocomplete="off" placeholder="125 / 第41卷 / 剧场版">
      </label>
      <label class="field">
        <span>观看状态</span>
        <select name="watch">
          <option>未看</option>
          <option selected>看着</option>
          <option>看完了</option>
        </select>
      </label>
    </div>

    <div class="row3">
      <label class="field">
        <span>状态</span>
        <select name="status">
          <option selected>未完结</option>
          <option>完结</option>
        </select>
      </label>
      <label class="field">
        <span>分类</span>
        <select name="category">
          <option selected>动画</option>
          <option>漫画</option>
          <option>电影</option>
        </select>
      </label>
      <label class="field">
        <span>区域</span>
        <select name="region" id="fRegion"></select>
      </label>
    </div>

    <label class="field">
      <span>链接</span>
      <input name="url" type="url" autocomplete="off" placeholder="https://…">
    </label>

    <label class="field">
      <span>备注</span>
      <textarea name="note" rows="2" placeholder="正常更新 / 停更2年了 / 无望第二季…"></textarea>
    </label>

    <footer class="modal-foot">
      <button type="button" class="btn btn-danger btn-ghost" id="btnDelete" hidden>删除</button>
      <div class="spacer"></div>
      <button type="button" class="btn btn-ghost" id="btnCancel">取消</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
